<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Planner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      color: #1f2937;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .quote-box {
      flex: 1;
      min-width: 260px;
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border-left: 6px solid #4f46e5;
    }

    .quote-box h2 {
      margin-bottom: 10px;
      font-size: 22px;
      color: #111827;
    }

    .quote-box p {
      font-size: 16px;
      line-height: 1.7;
      color: #4b5563;
    }

    .auth-box {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: flex-end;
      min-width: 220px;
    }

    .auth-btn {
      border: none;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .login-btn {
      background: white;
      color: #4f46e5;
      border: 2px solid #4f46e5;
    }

    .login-btn:hover {
      background: #eef2ff;
    }

    .signup-btn {
      background: #4f46e5;
      color: white;
    }

    .signup-btn:hover {
      background: #3730a3;
    }

    .calendar-section,
    .goals-section {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 24px;
      margin-bottom: 24px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .calendar-header h3 {
      font-size: 24px;
      color: #111827;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      border: none;
      background: #4f46e5;
      color: white;
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.25s ease;
    }

    .nav-btn:hover {
      background: #3730a3;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 14px;
    }

    .day-card {
      background: #f8fafc;
      border: 2px solid #e5e7eb;
      border-radius: 16px;
      padding: 14px;
      min-height: 165px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: 0.25s ease;
    }

    .day-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.12);
    }

    .day-card.today {
      border-color: #4f46e5;
      background: #eef2ff;
    }

    .day-name {
      font-weight: bold;
      color: #111827;
      font-size: 15px;
    }

    .day-date {
      font-size: 14px;
      color: #6b7280;
    }

    .task-label {
      font-size: 13px;
      font-weight: bold;
      color: #4f46e5;
      margin-top: 6px;
    }

    .task-input {
      width: 100%;
      min-height: 72px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 10px;
      resize: none;
      font-size: 14px;
      outline: none;
      font-family: Arial, sans-serif;
    }

    .task-input:focus,
    .goal-box textarea:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .goals-title {
      font-size: 24px;
      margin-bottom: 20px;
      color: #111827;
    }

    .goal-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .goal-box {
      background: #f8fafc;
      border: 2px solid #e5e7eb;
      border-radius: 18px;
      padding: 18px;
    }

    .goal-box h4 {
      margin-bottom: 12px;
      color: #111827;
      font-size: 18px;
    }

    .goal-box textarea {
      width: 100%;
      min-height: 160px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 12px;
      resize: vertical;
      font-size: 14px;
      outline: none;
      font-family: Arial, sans-serif;
    }

    .footer-note {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      padding-bottom: 10px;
    }

    @media (max-width: 960px) {
      .week-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .goal-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .week-grid {
        grid-template-columns: 1fr;
      }

      .auth-box {
        width: 100%;
        justify-content: flex-start;
      }

      .calendar-header {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="quote-box">
        <h2>Quote of the Week</h2>
        <p>"Success does not come from what you do occasionally, it comes from what you do consistently."</p>
      </div>

      <div class="auth-box">
        <button class="auth-btn login-btn">Log In</button>
        <button class="auth-btn signup-btn">Sign Up</button>
      </div>
    </div>

    <section class="calendar-section">
      <div class="calendar-header">
        <h3 id="weekTitle">Weekly Calendar</h3>
        <div class="nav-buttons">
          <button class="nav-btn" onclick="changeWeek(-1)">Previous</button>
          <button class="nav-btn" onclick="changeWeek(1)">Next</button>
        </div>
      </div>

      <div class="week-grid" id="weekGrid"></div>
    </section>

    <section class="goals-section">
      <h3 class="goals-title">Goals Planner</h3>
      <div class="goal-grid">
        <div class="goal-box">
          <h4>Weekly Goal</h4>
          <textarea placeholder="Write your weekly goals here..."></textarea>
        </div>
        <div class="goal-box">
          <h4>Monthly Goal</h4>
          <textarea placeholder="Write your monthly goals here..."></textarea>
        </div>
        <div class="goal-box">
          <h4>Yearly Goal</h4>
          <textarea placeholder="Write your yearly goals here..."></textarea>
        </div>
      </div>
    </section>

    <p class="footer-note">Made for GitHub Pages • Simple Weekly Planner Website</p>
  </div>

  <script>
    let currentWeekOffset = 0;

    function formatDate(date) {
      return date.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric'
      });
    }

    function getStartOfWeek(baseDate) {
      const date = new Date(baseDate);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function renderWeek() {
      const weekGrid = document.getElementById('weekGrid');
      const weekTitle = document.getElementById('weekTitle');
      weekGrid.innerHTML = '';

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const currentDate = new Date();
      currentDate.setDate(currentDate.getDate() + currentWeekOffset * 7);

      const startOfWeek = getStartOfWeek(currentDate);
      const endOfWeek = new Date(startOfWeek);
      endOfWeek.setDate(startOfWeek.getDate() + 6);

      weekTitle.textContent = `Weekly Calendar (${formatDate(startOfWeek)} - ${formatDate(endOfWeek)})`;

      for (let i = 0; i < 7; i++) {
        const dayDate = new Date(startOfWeek);
        dayDate.setDate(startOfWeek.getDate() + i);
        dayDate.setHours(0, 0, 0, 0);

        const isToday = dayDate.getTime() === today.getTime();

        const dayCard = document.createElement('div');
        dayCard.className = `day-card ${isToday ? 'today' : ''}`;

        const dayName = dayDate.toLocaleDateString('en-US', { weekday: 'long' });
        const displayDate = dayDate.toLocaleDateString('en-US', {
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        });

        dayCard.innerHTML = `
          <div class="day-name">${dayName}</div>
          <div class="day-date">${displayDate}</div>
          <div class="task-label">Today Task</div>
          <textarea class="task-input" placeholder="Write task here..."></textarea>
        `;

        weekGrid.appendChild(dayCard);
      }
    }

    function changeWeek(direction) {
      currentWeekOffset += direction;
      renderWeek();
    }

    renderWeek();
  </script>
</body>
</html>
